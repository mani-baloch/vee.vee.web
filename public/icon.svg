<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Background Circle with Soft Mint Glow -->
  <circle cx="50" cy="50" r="48" fill="#FDF4EC" stroke="#0F4A3E" stroke-width="3"/>
  
  <!-- Left Wing -->
  <ellipse cx="28" cy="38" rx="18" ry="11" transform="rotate(-30 28 38)" fill="#FED7AA" fill-opacity="0.9" stroke="#D97706" stroke-width="3"/>
  <ellipse cx="28" cy="38" rx="11" ry="6" transform="rotate(-30 28 38)" stroke="#F59E0B" stroke-width="1.8" stroke-dasharray="2 3"/>

  <!-- Right Wing -->
  <ellipse cx="72" cy="38" rx="18" ry="11" transform="rotate(30 72 38)" fill="#FED7AA" fill-opacity="0.9" stroke="#D97706" stroke-width="3"/>
  <ellipse cx="72" cy="38" rx="11" ry="6" transform="rotate(30 72 38)" stroke="#F59E0B" stroke-width="1.8" stroke-dasharray="2 3"/>

  <!-- Bee Body (Striped Oval) -->
  <ellipse cx="50" cy="56" rx="20" ry="26" fill="#FBBF24" stroke="#0F4A3E" stroke-width="3.5"/>
  
  <!-- Dark Stripes -->
  <path d="M32 46 C 40 41, 60 41, 68 46" stroke="#0F4A3E" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M30 57 C 39 52, 61 52, 70 57" stroke="#0F4A3E" stroke-width="5" stroke-linecap="round"/>
  <path d="M34 68 C 42 64, 58 64, 66 68" stroke="#0F4A3E" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Head -->
  <circle cx="50" cy="31" r="13" fill="#0F4A3E"/>
  
  <!-- Eyes -->
  <circle cx="45" cy="29" r="2.2" fill="#FFFFFF"/>
  <circle cx="55" cy="29" r="2.2" fill="#FFFFFF"/>

  <!-- Antennae -->
  <path d="M44 21 Q 36 12 32 14" stroke="#0F4A3E" stroke-width="3" stroke-linecap="round"/>
  <circle cx="31" cy="14" r="3" fill="#F59E0B" stroke="#0F4A3E" stroke-width="1.5"/>
  
  <path d="M56 21 Q 64 12 68 14" stroke="#0F4A3E" stroke-width="3" stroke-linecap="round"/>
  <circle cx="69" cy="14" r="3" fill="#F59E0B" stroke="#0F4A3E" stroke-width="1.5"/>

  <!-- Stinger -->
  <path d="M48 81 L50 87 L52 81 Z" fill="#0F4A3E"/>
</svg>
